<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="popup.title">广告清理工具-Ad-Cleaner</title>
    <script src="theme.js"></script>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <div class="hero-bar">
          <div class="eyebrow">广告清理工具-Ad-Cleaner</div>
          <div class="hero-actions">
            <div class="theme-switch">
              <button type="button" data-theme-toggle>跟随系统</button>
            </div>
            <div class="language-switch">
              <button type="button" data-language-toggle>English</button>
            </div>
          </div>
        </div>
        <h1 data-i18n="popup.heading">拦截、标记、清理</h1>
        <p class="lede" data-i18n="popup.intro">自动挡住常见广告请求，并把网页里疑似广告的块高亮出来，方便一键清理。</p>
      </section>

      <section class="panel">
        <div class="status-row">
          <div>
            <div class="label" data-i18n="popup.currentPage">当前页面</div>
            <div id="pageStatus" class="value" data-i18n="popup.connecting">正在连接…</div>
          </div>
          <label class="switch">
            <input id="enabledToggle" type="checkbox" />
            <span class="track"></span>
          </label>
        </div>

        <div class="count-card">
          <div class="count-number" id="markedCount">0</div>
          <div class="count-copy" data-i18n="popup.marked">个广告候选已标记</div>
        </div>

          <div class="metric-grid">
            <div class="metric-pill">
              <div class="label" data-i18n="popup.pageMode">页面模式</div>
              <div id="profileStatus" class="metric-value" data-i18n="popup.standardMode">标准模式</div>
            </div>
          <div class="metric-pill">
            <div class="label" data-i18n="popup.heuristic">启发式</div>
            <div id="heuristicCount" class="metric-value">0</div>
          </div>
          <div class="metric-pill">
            <div class="label" data-i18n="popup.customHits">自定义命中</div>
            <div id="customHits" class="metric-value">0</div>
          </div>
          <div class="metric-pill">
            <div class="label" data-i18n="popup.subscriptionHits">订阅命中</div>
            <div id="subscriptionHits" class="metric-value">0</div>
          </div>
            <div class="metric-pill">
              <div class="label" data-i18n="popup.restored">恢复次数</div>
              <div id="restoredCount" class="metric-value">0</div>
            </div>
          <div class="metric-pill">
            <div class="label" data-i18n="popup.syncStatus">同步状态</div>
            <div id="syncStatus" class="metric-value">0 跳过</div>
          </div>
          <div class="metric-pill">
            <div class="label" data-i18n="popup.networkMatches">拦截链接</div>
            <div id="networkMatches" class="metric-value" data-i18n="popup.checking">检查中</div>
          </div>
          </div>

        <div class="actions">
          <button id="scanBtn" class="primary" data-i18n="popup.rescan">重新扫描</button>
          <button id="cleanBtn" class="danger" data-i18n="popup.hideNow">立即隐藏</button>
          <button id="restoreBtn" class="ghost" data-i18n="popup.restore">恢复清理</button>
          <button id="panelBtn" class="ghost" data-i18n="popup.recovery">误杀面板</button>
          <button id="pickBtn" class="ghost" data-i18n="popup.picker">点选屏蔽</button>
        </div>

        <div class="site-panel">
          <div class="site-meta">
            <div class="label" data-i18n="popup.site">当前站点</div>
            <div id="siteHost" class="site-host" data-i18n="popup.identifying">正在识别…</div>
            <div id="siteMode" class="site-mode" data-i18n="status.default">默认</div>
          </div>
          <div class="filter-row">
            <div class="filter-copy">
              <div class="label" data-i18n="popup.builtinFilter">内置过滤</div>
              <div id="filterMode" class="site-mode" data-i18n="popup.enabled">开启</div>
            </div>
            <label class="switch compact">
              <input id="builtinToggle" type="checkbox" />
              <span class="track"></span>
            </label>
          </div>
          <div class="site-actions">
            <button id="allowSiteBtn" class="ghost" data-i18n="popup.allow">白名单</button>
            <button id="blockSiteBtn" class="danger" data-i18n="popup.block">黑名单</button>
            <button id="clearSiteBtn" class="ghost" data-i18n="popup.clear">清除</button>
            <button id="openOptionsBtn" class="ghost" data-i18n="popup.options">设置页</button>
          </div>
        </div>

        <div class="footnote">
          <span data-i18n="popup.footnote">订阅和手动规则会持续生效，内置过滤可以在设置页单独关闭。</span>
        </div>
      </section>
    </main>

    <script src="i18n.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
